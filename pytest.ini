[pytest]
# 只从 test/ 收集测试
testpaths = test
python_files = test_*.py
python_classes = *Test *Tests
python_functions = test_*

# 手动/联调脚本目录：不要递归收集（会触发真实 LLM / MCP / 数据库调用）
# 与 test/conftest.py 的 collect_ignore_glob 是双保险
norecursedirs = test/manual .venv venv node_modules vue .git __pycache__ logs docs

# 输出：简短 traceback + 显示跳过原因
addopts = -ra --strict-markers
