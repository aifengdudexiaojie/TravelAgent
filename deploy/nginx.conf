# ================================================================================
# Nginx 站点配置：前端静态文件 + /api 反向代理（含 SSE 必须的设置）
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/travel-agent
#   sudo sed -i 's/example.com/你的域名/g' /etc/nginx/sites-available/travel-agent
#   sudo ln -sf /etc/nginx/sites-available/travel-agent /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 你的域名        # 自动申请证书并补上 443 段
# ================================================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # certbot 会自动改成 301 到 https
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # 证书（certbot 自动写入）
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 前端安全响应头（按需调整 CSP）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- 前端（Vue 构建产物） ----------
    root /opt/travelagent/vue/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;          # SPA 路由回退
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE（聊天/分析进度/日志流）必须关缓冲，否则进度会攒着一次性吐出
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # 分析任务可能跑几分钟，别用默认 60s
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- 简单限流（防刷：见 docs/deployment-audit.md P0-4） ----------
    # 先在 http{} 里定义：limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # 再在这里启用：
    # limit_req zone=api burst=30 nodelay;
}
