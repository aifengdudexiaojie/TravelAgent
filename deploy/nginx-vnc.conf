# ================================================================================
# nginx 片段：把 noVNC 挂在 /vnc/ 下（配合 deploy/install-xhs-vnc.sh）
#
# 安装：
#   sudo cp deploy/nginx-vnc.conf /etc/nginx/snippets/xhs-vnc.conf
#   然后在站点配置的 server { } 里加一行：
#       include /etc/nginx/snippets/xhs-vnc.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 访问：
#   http://<你的站点>/vnc/vnc.html?autoconnect=1&resize=scale&path=websockify
#
# 安全：noVNC 里就是**服务器上一个真实浏览器**（能操作小红书登录），所以必须加口令。
#       请把下面的口令换成你自己的（也可以直接用 .env 里的 LOG_VIEWER_PASSWORD 保持一致）。
#       没有配 TLS 时，口令是明文传输的，请自行评估；或用上面的 SSH 隧道方式。
# ================================================================================

location /vnc/ {
    # 基本认证：没有口令不能进（务必修改）
    auth_basic           "XHS desktop";
    auth_basic_user_file /etc/nginx/.htpasswd-xhs;

    proxy_pass           http://127.0.0.1:6080/;
    proxy_http_version   1.1;

    # WebSocket 升级（noVNC 靠它传画面与输入）
    proxy_set_header     Upgrade $http_upgrade;
    proxy_set_header     Connection "upgrade";
    proxy_set_header     Host $host;
    proxy_set_header     X-Real-IP $remote_addr;

    # VNC 是长连接：别让 nginx 提前断开
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_buffering      off;
}
